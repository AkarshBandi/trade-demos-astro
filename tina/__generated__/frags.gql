fragment PageParts on Page {
  __typename
  seoTitle
  blocks {
    __typename
    ... on PageBlocksHero {
      eyebrow
      headline
      tagline
      primaryAction {
        __typename
        label
        link
      }
      secondaryAction {
        __typename
        label
        link
      }
      image {
        __typename
        src
        alt
      }
    }
    ... on PageBlocksRichText {
      eyebrow
      headline
      body
    }
    ... on PageBlocksMedia {
      image {
        __typename
        src
        alt
        caption
      }
      aspect
    }
    ... on PageBlocksCta {
      headline
      text
      primaryLabel
      primaryLink
      secondaryLabel
      secondaryLink
    }
    ... on PageBlocksGallery {
      headline
      images {
        __typename
        src
        alt
        caption
      }
    }
    ... on PageBlocksAccordion {
      headline
      items {
        __typename
        title
        content
      }
    }
    ... on PageBlocksStats {
      headline
      items {
        __typename
        value
        label
      }
    }
    ... on PageBlocksTestimonial {
      quote
      author
      role
      avatar {
        __typename
        src
        alt
      }
    }
    ... on PageBlocksPricing {
      eyebrow
      headline
      subhead
      accent
      tiers {
        __typename
        title
        price
        priceNote
        desc
        bullets
        featured
        ctaLabel
        ctaLink
      }
      fine
    }
  }
}

fragment ConfigParts on Config {
  __typename
  seo {
    __typename
    title
    description
  }
  header {
    __typename
    wordmark
    wordmarkSub
    badge
    menuLabel
    nav {
      __typename
      title
      link
    }
    actions {
      __typename
      label
      link
      variant
    }
  }
  footer {
    __typename
    wordmark
    wordmarkSub
    blurb
    columns {
      __typename
      heading
      links {
        __typename
        title
        link
      }
    }
    footerNote
    credit
  }
}
